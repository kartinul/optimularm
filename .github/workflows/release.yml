name: release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk optimularm-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          xcodebuild -project macos/optimularm.xcodeproj -scheme optimularm -configuration Release
          -derivedDataPath build/mac CODE_SIGNING_ALLOWED=NO build
      - run: hdiutil create -volname optimularm -srcfolder build/mac/Build/Products/Release/optimularm.app -ov optimularm-${{ github.ref_name }}.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
